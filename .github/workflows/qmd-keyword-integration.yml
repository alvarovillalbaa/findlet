name: Findlet actual QMD keyword integration
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: findlet-qmd-keyword-20261107-2
  cancel-in-progress: false
jobs:
  keyword-pipeline:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/qa/findlet-qmd-keyword-20261107-2' &&
      github.repository == 'alvarovillalbaa/findlet' &&
      github.event.repository.private == false
    runs-on: macos-15
    timeout-minutes: 20
    env:
      CI: 'true'
      SOURCE_COMMIT: fbe7d922075db21972588aefa1d2a7b3dd3b7b87
      FINDLET_PUBLIC_REPOSITORY: 'true'
    steps:
      - name: Record earliest owned step
        shell: bash
        run: echo "FINDLET_KEYWORD_JOB_STARTED_MS=$(python3 -I -B -S -c 'import time; print(int(time.time()*1000))')" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 2
          persist-credentials: false
          clean: false
      - name: Exercise the actual owned-folder keyword pipeline
        shell: bash
        run: python3 -I -B -S Tests/scripts/run-keyword-integration.py --source-commit "$SOURCE_COMMIT"
